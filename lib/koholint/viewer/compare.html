<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koholint compare</title>
<style>
  :root { --bg: #14161a; --panel: #1c1f26; --line: #2a2e38; --ink: #e8e6df; --mut: #8b90a0; --acc: #6ec1a2; --warn: #e0a84a; --bad: #e06c6c; --blue: #6aa3e0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 -apple-system, system-ui, sans-serif; }
  a { color: var(--blue); }
  button, input, select { background: #252932; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; font: inherit; padding: 2px 10px; }
  button { cursor: pointer; }
  #nav { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  #nav b { letter-spacing: 0.04em; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
  .seg a { padding: 3px 14px; font-size: 12.5px; color: var(--mut); text-decoration: none; }
  .seg a.here { background: #b83a3a; color: #fff; }
  .pill { display: inline-block; padding: 1px 10px; border-radius: 99px; font-size: 12px; border: 1px solid var(--line); color: var(--mut); overflow-wrap: anywhere; }
  .pill:empty { display: none; }
  #error { display: none; padding: 8px 16px; background: #a60; color: #fff; }
  .scroll { overflow-x: auto; margin: 0 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  h2 { margin: 16px 16px 6px; font-size: 11.5px; font-weight: 600; color: var(--mut); text-transform: uppercase; letter-spacing: 0.1em; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 5px 12px; border-bottom: 1px solid #22262e; text-align: left; overflow-wrap: anywhere; }
  th { color: var(--mut); font-weight: 600; }
  tr.diff td { background: #3b3017; color: var(--warn); }
  td.missing { color: #666; }
</style>
</head>
<body>
<nav id="nav"><b>KOHOLINT</b><span class="seg"><a href="/">Live</a><a href="/runs">Historique</a><a class="here" id="compare" href="#">Comparer</a></span><span id="nav-run" class="pill"></span></nav>
<div id="error"></div>
<h2>Summary</h2>
<div class="scroll"><table><thead><tr><th>field</th><th id="head-a"></th><th id="head-b"></th></tr></thead><tbody id="summary"></tbody></table></div>
<h2>Usage</h2>
<div class="scroll"><table><thead><tr><th>field</th><th>a</th><th>b</th></tr></thead><tbody id="usage"></tbody></table></div>
<h2>Cost by skill</h2>
<div class="scroll"><table><thead><tr><th>skill</th><th>a</th><th>b</th></tr></thead><tbody id="cost"></tbody></table></div>
<h2>Milestones (first frame)</h2>
<div class="scroll"><table><thead><tr><th>milestone</th><th>a</th><th>b</th></tr></thead><tbody id="milestones"></tbody></table></div>
<h2>Places visited (first frame)</h2>
<div class="scroll"><table><thead><tr><th>place</th><th>a</th><th>b</th></tr></thead><tbody id="places"></tbody></table></div>
<script>
(function () {
  // pure:begin
  function idsFromPath(pathname) {
    var match = /^\/compare\/([^\/]+)\/([^\/]+)$/.exec(pathname || '');
    if (!match) return null;
    try { return [decodeURIComponent(match[1]), decodeURIComponent(match[2])]; } catch (e) { return null; }
  }

  function valueText(value) {
    if (value === null || value === undefined) return '-';
    return typeof value === 'object' ? JSON.stringify(value) : String(value);
  }

  function fieldRows(a, b, differences, text) {
    a = a || {};
    b = b || {};
    differences = differences || [];
    text = text || valueText;
    var fields = Object.keys(a).concat(Object.keys(b).filter(function (field) { return !(field in a); }));
    return fields.map(function (field) {
      return { field: field, a: text(a[field]), b: text(b[field]), diff: differences.indexOf(field) >= 0 };
    });
  }

  function summaryRows(data) { return fieldRows(data.a && data.a.summary, data.b && data.b.summary, data.differences); }

  function costText(cost) {
    if (!cost || typeof cost !== 'object') return '-';
    return cost.calls + ' calls, $' + (typeof cost.usd === 'number' ? cost.usd.toFixed(4) : valueText(cost.usd));
  }

  function sectionRows(section, text) { section = section || {}; return fieldRows(section.a, section.b, section.differences, text); }

  function frameText(frame) { return typeof frame === 'number' ? 'f' + frame : 'never'; }

  function placeText(place) { return Array.isArray(place) ? '[' + place.join(',') + ']' : valueText(place); }
  // pure:end

  var errorEl = document.getElementById('error');

  function cell(text, className) {
    var td = document.createElement('td');
    td.textContent = text;
    if (className) td.className = className;
    return td;
  }

  function fill(id, rows) {
    var body = document.getElementById(id);
    body.textContent = '';
    rows.forEach(function (row) {
      var tr = document.createElement('tr');
      if (row.diff) tr.className = 'diff';
      tr.append(cell(row.label), cell(row.a, row.a === 'never' ? 'missing' : ''), cell(row.b, row.b === 'never' ? 'missing' : ''));
      body.appendChild(tr);
    });
  }

  function heading(id, runId) {
    var th = document.getElementById(id);
    th.textContent = '';
    var link = document.createElement('a');
    link.href = '/run/' + encodeURIComponent(runId);
    link.textContent = runId;
    th.appendChild(link);
  }

  function timelineRows(list, labelOf) {
    return (list || []).map(function (entry) {
      return { label: labelOf(entry), a: frameText(entry.a), b: frameText(entry.b), diff: entry.a !== entry.b };
    });
  }

  function render(data) {
    heading('head-a', data.a.run_id);
    heading('head-b', data.b.run_id);
    fill('summary', summaryRows(data).map(function (row) { return { label: row.field, a: row.a, b: row.b, diff: row.diff }; }));
    fill('usage', sectionRows(data.usage).map(function (row) { return { label: row.field, a: row.a, b: row.b, diff: row.diff }; }));
    fill('cost', sectionRows(data.cost_by_skill, costText).map(function (row) { return { label: row.field, a: row.a, b: row.b, diff: row.diff }; }));
    fill('milestones', timelineRows(data.milestones, function (entry) { return valueText(entry.milestone); }));
    fill('places', timelineRows(data.places, function (entry) { return placeText(entry.place); }));
  }

  var ids = idsFromPath(window.location.pathname);
  if (ids) {
    document.getElementById('nav-run').textContent = ids[0] + ' vs ' + ids[1];
    document.getElementById('compare').href = window.location.pathname;
  }
  if (!ids) {
    errorEl.style.display = 'block';
    errorEl.textContent = 'Expected /compare/<run>/<run>.';
  } else {
    fetch('/compare.json?a=' + encodeURIComponent(ids[0]) + '&b=' + encodeURIComponent(ids[1]), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('cannot compare (' + r.status + ')'); return r.json(); })
      .then(render)
      .catch(function (e) { errorEl.style.display = 'block'; errorEl.textContent = e.message; });
  }
})();
</script>
</body>
</html>
