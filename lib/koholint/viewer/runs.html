<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Koholint runs</title>
<style>
  body { margin: 0; background: #111; color: #ddd; font: 13px/1.4 monospace; }
  a { color: #8cf; }
  #nav, #filters { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; padding: 8px 12px; background: #222; }
  #filters { background: #1a1a1a; border-bottom: 1px solid #333; }
  input, select, button { background: #333; color: #ddd; border: 1px solid #555; font: inherit; padding: 2px 6px; }
  button { cursor: pointer; }
  #compare[aria-disabled="true"] { color: #777; pointer-events: none; text-decoration: none; }
  #error { display: none; padding: 8px 12px; background: #a60; color: #fff; }
  table { border-collapse: collapse; margin: 12px; }
  th, td { padding: 3px 10px; border-bottom: 1px solid #2a2a2a; text-align: left; white-space: nowrap; }
  th { color: #888; font-weight: normal; cursor: pointer; user-select: none; }
  th.sorted { color: #fff; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.why { white-space: normal; color: #9ab; max-width: 30em; overflow-wrap: anywhere; }
  tr:hover td { background: #1b1b1b; }
</style>
</head>
<body>
<div id="nav"><b>Runs</b><a href="/">back to live</a><a id="compare" href="#" aria-disabled="true">compare the two picked runs</a><span id="count"></span></div>
<div id="filters">
  <label>min milestone <select id="milestone"></select></label>
  <label>max dollars <input id="dollars" type="number" min="0" step="0.01"></label>
  <label>tag <input id="tag" type="text" size="12"></label>
  <label><input id="starred" type="checkbox"> starred only</label>
</div>
<div id="error"></div>
<table><thead><tr id="head"></tr></thead><tbody id="rows"></tbody></table>
<script>
(function () {
  // pure:begin
  var COLUMNS = [
    { key: 'starred', label: '★' }, { key: 'run_id', label: 'run' }, { key: 'tag', label: 'tag' }, { key: 'flow_version', label: 'flow' },
    { key: 'frames', label: 'frames', num: true }, { key: 'dollars', label: 'dollars', num: true }, { key: 'calls', label: 'calls', num: true },
    { key: 'usd_per_1000f', label: 'usd/1000f', num: true }, { key: 'highest_milestone', label: 'milestone' },
    { key: 'places_seen', label: 'places', num: true }, { key: 'stop_reason', label: 'stop' }, { key: 'why', label: 'why' }
  ];

  function rank(run) { return typeof run.milestone_rank === 'number' ? run.milestone_rank : -1; }

  function milestoneOptions(runs) {
    var seen = {};
    runs.forEach(function (run) { if (typeof run.highest_milestone === 'string') seen[run.highest_milestone] = rank(run); });
    return Object.keys(seen).sort(function (a, b) { return seen[a] - seen[b]; }).map(function (name) { return { name: name, rank: seen[name] }; });
  }

  function filterRuns(runs, f) {
    return runs.filter(function (run) {
      if (typeof f.minRank === 'number' && rank(run) < f.minRank) return false;
      if (typeof f.maxDollars === 'number' && !(typeof run.dollars === 'number' && run.dollars <= f.maxDollars)) return false;
      if (f.tag && String(run.tag || '').toLowerCase().indexOf(f.tag.toLowerCase()) < 0) return false;
      if (f.starredOnly && !run.starred) return false;
      return true;
    });
  }

  function sortValue(run, key) {
    if (key === 'highest_milestone') return rank(run);
    if (key === 'starred') return run.starred ? 1 : 0;
    var value = run[key];
    return value === null || value === undefined ? null : value;
  }

  function sortRuns(runs, key, descending) {
    return runs.slice().sort(function (a, b) {
      var x = sortValue(a, key), y = sortValue(b, key);
      if (x === y) return a.run_id < b.run_id ? 1 : -1;
      if (x === null) return 1;
      if (y === null) return -1;
      var order = x < y ? -1 : 1;
      return descending ? -order : order;
    });
  }

  function cellText(run, column) {
    var value = run[column.key];
    if (column.key === 'starred') return value ? '★' : '';
    if (value === null || value === undefined) return '';
    if (column.key === 'dollars' || column.key === 'usd_per_1000f') return typeof value === 'number' ? value.toFixed(4) : String(value);
    return String(value);
  }

  function compareHref(ids) {
    if (ids.length !== 2) return null;
    return '/compare/' + encodeURIComponent(ids[0]) + '/' + encodeURIComponent(ids[1]);
  }
  // pure:end

  var all = [];
  var picked = [];
  var sort = { key: 'run_id', descending: true };
  var rows = document.getElementById('rows');
  var head = document.getElementById('head');
  var errorEl = document.getElementById('error');
  var compareLink = document.getElementById('compare');
  var milestoneSelect = document.getElementById('milestone');
  var inputs = ['milestone', 'dollars', 'tag', 'starred'].map(function (id) { return document.getElementById(id); });

  function filters() {
    var dollars = parseFloat(document.getElementById('dollars').value);
    var minRank = milestoneSelect.value === '' ? null : Number(milestoneSelect.value);
    return { minRank: minRank, maxDollars: isNaN(dollars) ? null : dollars, tag: document.getElementById('tag').value.trim(),
             starredOnly: document.getElementById('starred').checked };
  }

  function showError(text) {
    errorEl.style.display = text ? 'block' : 'none';
    errorEl.textContent = text || '';
  }

  function renderHead() {
    head.textContent = '';
    var pick = document.createElement('th');
    pick.textContent = 'pick';
    head.appendChild(pick);
    COLUMNS.forEach(function (column) {
      var th = document.createElement('th');
      th.textContent = column.label + (sort.key === column.key ? (sort.descending ? ' ▼' : ' ▲') : '');
      if (sort.key === column.key) th.className = 'sorted';
      th.addEventListener('click', function () {
        sort = { key: column.key, descending: sort.key === column.key ? !sort.descending : column.num === true };
        render();
      });
      head.appendChild(th);
    });
    head.appendChild(document.createElement('th'));
  }

  function renderCompare() {
    var href = compareHref(picked);
    compareLink.setAttribute('aria-disabled', href ? 'false' : 'true');
    compareLink.href = href || '#';
  }

  function star(run) {
    var why = window.prompt('Why star ' + run.run_id + '?');
    if (!why || !why.trim()) return;
    fetch('/star?run=' + encodeURIComponent(run.run_id), { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                                                         body: 'why=' + encodeURIComponent(why.trim()) })
      .then(function (r) { if (!r.ok) throw new Error('star failed (' + r.status + ')'); return load(); })
      .catch(function (e) { showError(e.message); });
  }

  function renderRow(run) {
    var tr = document.createElement('tr');
    var pickCell = document.createElement('td');
    var box = document.createElement('input');
    box.type = 'checkbox';
    box.checked = picked.indexOf(run.run_id) >= 0;
    box.addEventListener('change', function () {
      picked = picked.filter(function (id) { return id !== run.run_id; });
      if (box.checked) picked.push(run.run_id);
      if (picked.length > 2) picked = picked.slice(-2);
      render();
    });
    pickCell.appendChild(box);
    tr.appendChild(pickCell);
    COLUMNS.forEach(function (column) {
      var td = document.createElement('td');
      if (column.num) td.className = 'num';
      if (column.key === 'why') td.className = 'why';
      if (column.key === 'run_id') {
        var link = document.createElement('a');
        link.href = '/run/' + encodeURIComponent(run.run_id);
        link.textContent = run.run_id;
        td.appendChild(link);
      } else {
        td.textContent = cellText(run, column);
      }
      tr.appendChild(td);
    });
    var action = document.createElement('td');
    if (!run.starred) {
      var button = document.createElement('button');
      button.type = 'button';
      button.textContent = '★ Star';
      button.addEventListener('click', function () { star(run); });
      action.appendChild(button);
    }
    tr.appendChild(action);
    return tr;
  }

  function render() {
    renderHead();
    renderCompare();
    var shown = sortRuns(filterRuns(all, filters()), sort.key, sort.descending);
    document.getElementById('count').textContent = shown.length + ' of ' + all.length + ' runs';
    rows.textContent = '';
    shown.forEach(function (run) { rows.appendChild(renderRow(run)); });
  }

  function renderMilestones() {
    var current = milestoneSelect.value;
    milestoneSelect.textContent = '';
    var any = document.createElement('option');
    any.value = '';
    any.textContent = 'any';
    milestoneSelect.appendChild(any);
    milestoneOptions(all).forEach(function (option) {
      var item = document.createElement('option');
      item.value = String(option.rank);
      item.textContent = option.name;
      milestoneSelect.appendChild(item);
    });
    milestoneSelect.value = current;
  }

  function load() {
    return fetch('/runs.json', { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('cannot list runs (' + r.status + ')'); return r.json(); })
      .then(function (runs) { all = Array.isArray(runs) ? runs : []; showError(null); renderMilestones(); render(); })
      .catch(function (e) { showError(e.message); });
  }

  inputs.forEach(function (input) { input.addEventListener('input', render); input.addEventListener('change', render); });
  load();
})();
</script>
</body>
</html>
