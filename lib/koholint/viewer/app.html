<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koholint</title>
<style>  :root {
    color-scheme: light dark;
    --bg: light-dark(#eef0e2, #121512); --panel: light-dark(#fbfcf4, #1a1e1a); --line: light-dark(#d5dac2, #283028); --soft: light-dark(#e3e7d2, #20261f);
    --ink: light-dark(#1b2a1b, #e6ecd8); --mut: light-dark(#6c7a63, #8c9a84); --warn: light-dark(#c08a1e, #f0b54a); --bad: light-dark(#c04545, #ef6f6f); --blue: light-dark(#2f6fb8, #7ab0ec);
    --gb0: #0f380f; --gb1: #306230; --gb2: #8bac0f; --gb3: #9bbc0f; --acc: light-dark(#306230, #8bac0f);
    --fog: light-dark(#c9cdb8, #0b0d0b); --fog2: light-dark(#d9ddc8, #151915); --ghost: light-dark(rgba(15,56,15,.5), rgba(220,240,180,.5));
    --ease: cubic-bezier(.22,1,.36,1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 -apple-system, system-ui, sans-serif; overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
  input { font: inherit; color: inherit; }
  .px { image-rendering: pixelated; }
  .ico { width: 16px; height: 16px; vertical-align: -3px; }
  .mut { color: var(--mut); } .num { font-variant-numeric: tabular-nums; }

  header { height: 52px; display: flex; align-items: center; gap: 18px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line); position: relative; z-index: 30; }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; letter-spacing: .14em; font-size: 13px; }
  nav { display: flex; gap: 4px; background: var(--soft); padding: 3px; border-radius: 12px; position: relative; }
  nav button { position: relative; z-index: 1; display: flex; align-items: center; gap: 7px; padding: 6px 14px; border-radius: 9px; font-weight: 600; color: var(--mut); transition: color .25s; }
  nav button[aria-current="page"] { color: var(--gb3); }
  nav .pill { position: absolute; top: 3px; bottom: 3px; border-radius: 9px; background: var(--gb0); transition: left .45s var(--ease), width .45s var(--ease); }
  .chips { display: flex; align-items: center; gap: 14px; margin-left: auto; font-variant-numeric: tabular-nums; }
  .chip { display: flex; align-items: center; gap: 6px; font-weight: 700; }
  .chip small { font-weight: 500; color: var(--mut); }
  .held { display: flex; gap: 3px; }
  .tool { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--mut); transition: background .15s, color .15s; }
  .tool:hover, .tool[aria-pressed="true"] { background: var(--soft); color: var(--ink); }

  main { position: relative; height: calc(100% - 52px); overflow: hidden; }
  .place { position: absolute; inset: 0; display: flex; opacity: 0; pointer-events: none; transform: translateX(40px) scale(.985); transition: opacity .45s var(--ease), transform .55s var(--ease); }
  .place.left { transform: translateX(-40px) scale(.985); }
  .place.on { opacity: 1; pointer-events: auto; transform: none; }

  /* ÎLE */
  #ile { padding: 18px 24px; gap: 24px; justify-content: center; align-items: flex-start; }
  .mapbox { position: relative; }
  .island { position: relative; display: grid; border-radius: 8px; overflow: hidden; background: var(--fog); box-shadow: 0 0 0 1px var(--line), 0 20px 50px -20px rgba(0,0,0,.5); }
  .cell { position: relative; background: var(--fog); }
  .cell.edge { background: var(--fog2); }
  .cell.edge::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(139,172,15,.08), transparent 70%); }
  .cell img { width: 100%; height: 100%; display: block; }
  .cell.seen { cursor: pointer; }
  .cell.seen:hover img { filter: brightness(1.12); }
  .cell.sel { outline: 3px solid var(--warn); outline-offset: -3px; z-index: 2; }
  .cell.new img { animation: clear 1.1s var(--ease); }
  @keyframes clear { from { opacity: 0; filter: blur(6px) brightness(2.2) sepia(1) hue-rotate(40deg); transform: scale(1.15); } }
  .island > svg { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
  .trail { stroke: var(--ghost); stroke-linecap: round; fill: none; }
  .mytrail { fill: none; stroke: var(--warn); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 2 9; animation: march 1s linear infinite; filter: drop-shadow(0 0 3px rgba(0,0,0,.6)); }
  @keyframes march { to { stroke-dashoffset: -11; } }
  .ring { fill: none; stroke: var(--warn); stroke-width: 3; animation: pulse 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 50% { opacity: .3; transform: scale(1.2); } }
  .sprite { position: absolute; width: 26px; height: 26px; left: 0; top: 0; pointer-events: none; transition: transform .28s linear; z-index: 5; filter: drop-shadow(0 2px 2px rgba(0,0,0,.6)); }
  .sprite svg { width: 100%; height: 100%; animation: bob .28s steps(2) infinite; }
  @keyframes bob { 50% { transform: translateY(-2px); } }
  .banner { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); z-index: 6; display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 14px; border-radius: 99px; background: var(--gb0); color: var(--gb3); font-size: 13px; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.4); animation: drop .4s var(--ease); white-space: nowrap; }
  .banner button { width: 24px; height: 24px; border-radius: 50%; background: rgba(155,188,15,.15); }
  @keyframes drop { from { transform: translate(-50%, -16px); opacity: 0; } }
  .scrub { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
  .scrub input[type=range] { flex: 1; accent-color: var(--gb1); }
  .round { width: 40px; height: 40px; border-radius: 50%; background: var(--gb0); color: var(--gb3); display: grid; place-items: center; box-shadow: 0 4px 12px rgba(0,0,0,.25); transition: transform .15s; }
  .round:hover { transform: scale(1.06); }
  .side { width: 320px; display: flex; flex-direction: column; gap: 16px; }
  .hero { font-size: 72px; font-weight: 800; line-height: .95; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .hero small { font-size: 24px; font-weight: 600; color: var(--mut); letter-spacing: 0; }
  .cap { font-size: 12.5px; color: var(--mut); }
  .loc { display: grid; grid-template-columns: repeat(16, 1fr); gap: 1px; width: 144px; }
  .loc i { aspect-ratio: 10/9; background: var(--fog); border-radius: 1px; } .loc i.in { background: var(--fog2); } .loc i.s { background: var(--acc); }
  .spark { width: 100%; height: 54px; }
  .spark path { fill: none; stroke: var(--acc); stroke-width: 2; } .spark .area { fill: color-mix(in oklab, var(--acc) 16%, transparent); stroke: none; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--mut); }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .next .lbl { font-size: 11px; font-weight: 800; letter-spacing: .14em; color: var(--warn); display: flex; justify-content: space-between; }
  .next q { display: block; font-size: 17px; font-style: italic; line-height: 1.3; margin: 8px 0 6px; }
  .next .where { display: flex; gap: 10px; align-items: center; font-size: 12.5px; color: var(--mut); }
  .next img { width: 64px; border-radius: 4px; }
  .linkish { color: var(--blue); cursor: pointer; }
  .shot { position: relative; border-radius: 8px; overflow: hidden; }
  .shot img { width: 100%; display: block; }
  .shot i { position: absolute; border-radius: 50%; background: var(--warn); transform: translate(-50%, -50%); mix-blend-mode: hard-light; }
  .facts { display: flex; gap: 14px; align-items: baseline; margin: 10px 0; font-variant-numeric: tabular-nums; }
  .facts b { font-size: 22px; }

  /* DIRECT */
  #direct { flex-direction: column; padding: 16px 24px; gap: 14px; overflow: auto; }
  .runhead { display: flex; align-items: center; gap: 14px; font-size: 13px; }
  .runhead h2 { margin: 0; font-size: 18px; font-variant-numeric: tabular-nums; }
  .tag { padding: 2px 9px; border-radius: 99px; background: var(--soft); color: var(--mut); font-size: 12px; font-weight: 600; }
  .tag.live { background: var(--bad); color: #fff; animation: blink2 1.4s infinite; }
  @keyframes blink2 { 50% { opacity: .55; } }
  .xbtn { display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); font-size: 12.5px; font-weight: 600; }
  .xbtn:hover { border-color: var(--acc); }
  .btns { display: flex; gap: 8px; margin-top: 10px; }
  .top { display: flex; gap: 22px; align-items: flex-start; }
  .stage { position: relative; flex: none; }
  .screen { width: 400px; height: 360px; display: block; border-radius: 10px; box-shadow: 0 0 0 6px var(--gb0), 0 0 0 7px var(--line), 0 24px 50px -20px rgba(0,0,0,.6); transition: opacity .25s; }
  .hud { display: flex; align-items: center; gap: 16px; margin-top: 14px; font-size: 16px; font-variant-numeric: tabular-nums; }
  .hearts { display: flex; gap: 2px; } .hearts svg { width: 22px; height: 22px; }
  .rcol { flex: 1; min-width: 340px; max-width: 520px; display: flex; flex-direction: column; gap: 12px; }
  .bubble { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; font-size: 17px; line-height: 1.35; min-height: 112px; }
  .bubble::before { content: ""; position: absolute; left: -9px; top: 34px; width: 16px; height: 16px; background: var(--panel); border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: rotate(45deg); }
  .bubble p { margin: 4px 0 0; animation: fade .4s var(--ease); }
  @keyframes fade { from { opacity: 0; transform: translateY(5px); } }
  .sk { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 1px 8px; border-radius: 99px; background: var(--gb0); color: var(--gb3); }
  .goal { display: flex; gap: 10px; align-items: center; font-size: 14px; padding: 9px 12px; border-radius: 12px; background: color-mix(in oklab, var(--warn) 13%, var(--panel)); border: 1px solid color-mix(in oklab, var(--warn) 40%, var(--line)); }
  .pcard { display: flex; gap: 12px; align-items: center; }
  .pcard .big { font-size: 28px; font-weight: 800; }
  .pcard .ents { display: flex; gap: 10px; font-size: 13px; color: var(--mut); }
  .cmini { display: grid; grid-template-columns: repeat(16, 1fr); gap: 2px; width: 190px; flex: none; }
  .cmini i { aspect-ratio: 10/9; border-radius: 2px; background: var(--soft); }
  .cmini i.s { background: color-mix(in oklab, var(--acc) 45%, var(--soft)); } .cmini i.t { background: color-mix(in oklab, var(--warn) 45%, var(--soft)); }
  .cmini i.here { background: var(--warn); animation: blink2 .8s infinite; }
  .tline { position: relative; height: 54px; margin-top: 4px; }
  .tline .track { position: absolute; left: 0; right: 0; top: 26px; height: 6px; border-radius: 3px; background: var(--soft); }
  .tline .fill { position: absolute; left: 0; top: 26px; height: 6px; border-radius: 3px; background: var(--gb1); }
  .tline .mk { position: absolute; top: 4px; transform: translateX(-50%); font-size: 12px; line-height: 1; }
  .tline .mk.p { top: 38px; width: 2px; height: 10px; background: var(--acc); }
  .tline input { position: absolute; left: 0; right: 0; top: 18px; width: 100%; margin: 0; opacity: 0; height: 22px; cursor: pointer; }
  .tline .knob { position: absolute; top: 20px; width: 18px; height: 18px; border-radius: 50%; background: var(--gb3); border: 3px solid var(--gb0); transform: translateX(-50%); pointer-events: none; }
  .trow { display: flex; align-items: center; gap: 12px; }
  .cols { display: grid; grid-template-columns: 1.1fr 1.3fr .8fr; gap: 14px; }
  .cols h3 { margin: 0 0 8px; font-size: 12px; letter-spacing: .1em; color: var(--mut); text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
  .list { display: flex; flex-direction: column; gap: 6px; max-height: 210px; overflow: auto; font-size: 13px; }
  .ob { display: grid; grid-template-columns: 18px 1fr auto; gap: 6px; align-items: start; }
  .ob.fut { opacity: .3; } .ob.now { font-weight: 700; }
  .ob.grp { cursor: pointer; } .ob .n { color: var(--mut); font-weight: 600; margin-left: 6px; } .ob.sub { padding-left: 18px; font-size: 12.5px; color: var(--mut); }
  #metro { flex-direction: column; padding: 16px 24px; }
  #metro .mhead { display: flex; align-items: flex-end; gap: 28px; }
  #msvg { flex: 1; width: 100%; min-height: 0; }
  .ln { fill: none; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; cursor: pointer; transition: opacity .3s; }
  .ln.main { stroke-width: 11; }
  .ln:hover { stroke-width: 9; }
  .st { fill: var(--bg); stroke: var(--ink); stroke-width: 3; cursor: pointer; }
  .xch { fill: var(--panel); stroke: var(--ink); stroke-width: 3; cursor: pointer; }
  .term { fill: var(--ink); }
  .dim { opacity: .12; }
  .ckname { font-size: 12.5px; fill: var(--ink); font-weight: 700; }
  .hid { font-size: 11px; fill: var(--mut); font-weight: 700; }
  .axis text { font-size: 11px; fill: var(--mut); } .axis line { stroke: var(--soft); }
  .msel { position: absolute; right: 24px; bottom: 22px; width: 330px; animation: drop2 .35s var(--ease); }
  @keyframes drop2 { from { transform: translateY(14px); opacity: 0; } }
  .scrim { position: fixed; inset: 52px 0 0 0; background: rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 39; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  aside { position: fixed; top: 52px; right: 0; bottom: 0; width: 420px; background: var(--panel); border-left: 1px solid var(--line); z-index: 40; transform: translateX(100%); transition: transform .45s var(--ease); display: flex; flex-direction: column; }
  aside.on { transform: none; }
  aside .h { padding: 14px 16px 10px; display: flex; align-items: center; gap: 10px; }
  aside .h b { font-size: 15px; }
  aside .body { flex: 1; overflow: auto; padding: 0 10px 16px; }
  .search { flex: 1; padding: 7px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .runitem { width: 100%; display: grid; grid-template-columns: 18px 72px 1fr 56px 22px; gap: 8px; align-items: center; padding: 8px; border-radius: 10px; text-align: left; font-size: 13px; font-variant-numeric: tabular-nums; cursor: pointer; }
  .runitem:hover { background: var(--soft); }
  .runitem .stb { color: var(--line); } .runitem .stb.on { color: var(--warn); }
  .runmore { margin: 0 8px 10px 34px; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; }
  .runmore textarea, .runmore input { width: 100%; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; }
  .runmore textarea { min-height: 70px; resize: vertical; }
  .lead { display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: start; padding: 8px; border-radius: 10px; font-size: 13px; }
  .lead q { font-style: italic; }
  .lead .dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 5px; }
  .person { margin: 8px 6px 14px; }
  .person b { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .person .dl { margin: 0 0 5px; font-size: 13px; }
  .dl { padding: 6px 10px; border-radius: 10px 10px 10px 2px; background: var(--soft); white-space: pre-line; }
  .dl.fut { display: none; }
  .dl small { display: block; color: var(--mut); font-size: 11px; }
  .bar { display: grid; grid-template-columns: 70px 1fr 28px; gap: 8px; align-items: center; font-size: 12.5px; }
  .bar i { display: block; height: 8px; border-radius: 4px; background: var(--gb1); transition: width .5s var(--ease); }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  .empty { margin: auto; display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--ink); font-size: 15px; }
  .sprite-big { width: 48px; height: 48px; animation: bob .5s steps(2) infinite; }
  a.tool, a.xbtn { text-decoration: none; color: inherit; }
  button.tag.live { border: 0; cursor: pointer; }
  .legacy { position: relative; }
  .legacy summary { list-style: none; color: var(--mut); }
  .legacy summary::-webkit-details-marker { display: none; }
  .legacy .menu { position: absolute; right: 0; top: 38px; display: flex; flex-direction: column; min-width: 120px; padding: 4px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 10px 30px -10px rgba(0,0,0,.4); }
  .legacy .menu a { padding: 7px 10px; border-radius: 7px; text-decoration: none; color: inherit; font-weight: 600; font-size: 13px; }
  .legacy .menu a:hover { background: var(--soft); }
  .empty .btns { justify-content: center; }
  .bar.progress { width: 220px; display: block; height: 8px; border-radius: 4px; background: var(--soft); }
  #machines { flex-direction: column; padding: 18px 24px; gap: 14px; overflow: auto; }
  .mtable { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  .mtable th { text-align: left; font-size: 12px; color: var(--mut); font-weight: 600; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  .mtable td { padding: 9px 10px; border-bottom: 1px solid var(--line); }
  .mtable td.r, .mtable th.r { text-align: right; }
  .mtable a { color: var(--blue); text-decoration: none; }
</style>
</head>
