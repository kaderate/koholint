<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koholint live</title>
<style>
  body { margin: 0; overflow-x: hidden; background: #111; color: #ddd; font: 13px/1.4 monospace; }
  a { color: #8cf; }
  #nav { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; padding: 6px 12px; background: #1b1b1b; border-bottom: 1px solid #333; }
  #nav a { text-decoration: none; }
  #nav a.here { color: #fff; border-bottom: 2px solid #8cf; }
  #nav-run { color: #fd8; overflow-wrap: anywhere; }
  .badge { display: inline-block; padding: 0 8px; border: 1px solid #47a; border-radius: 9px; color: #cdf; background: #1a2233; font-size: 0.9em; }
  #nav-badge { display: none; }
  #bar { display: flex; flex-wrap: wrap; gap: 4px 20px; padding: 4px 12px; background: #1a1a1a; color: #999; }
  #bar .group { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; min-width: 0; overflow-wrap: anywhere; }
  #bar .group-label { color: #666; font-size: 0.85em; text-transform: uppercase; letter-spacing: 0.08em; }
  #bar b { color: #8f8; font-weight: normal; }
  #bar b.health-unknown { color: #aaa; }
  #banner, #lost { display: none; padding: 8px 12px; font-weight: bold; color: #fff; }
  #banner { background: #b00; }
  #lost { background: #a60; }
  #alerts { display: none; padding: 6px 12px; background: #4a1414; color: #fcc; border-bottom: 1px solid #a44; }
  #alerts div { overflow-wrap: anywhere; }
  #replay { display: none; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 6px 12px; background: #1a2233; border-bottom: 1px solid #47a; }
  button { background: #333; color: #ddd; border: 1px solid #555; font: inherit; padding: 2px 10px; cursor: pointer; }
  button.on { border-color: #8cf; color: #fff; }
  button:disabled { color: #777; cursor: default; }
  #replay-note { color: #9ab; }
  #blocks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 10px; align-items: start; }
  .block { background: #181818; border: 1px solid #2c2c2c; padding: 8px 10px; min-width: 0; overflow-wrap: anywhere; }
  .block h2 { margin: 0 0 6px; font-size: 0.85em; font-weight: normal; color: #888; text-transform: uppercase; letter-spacing: 0.08em; }
  .wide { grid-column: 1 / -1; }
  .muted { color: #9ab; }
  @media (max-width: 900px) {
    #blocks { grid-template-columns: minmax(0, 1fr); padding: 6px; gap: 6px; }
    #bar { flex-direction: column; }
  }
  #game-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-bottom: 6px; }
  #mode-badge.phase-unknown, #mode-badge.phase-boot { border-color: #a60; color: #fd8; background: #2a2010; }
  #mode-badge.phase-dialogue { border-color: #49c; color: #9cf; }
  #mode-badge.phase-menu, #mode-badge.phase-map, #mode-badge.phase-save { border-color: #a8c; color: #dcf; background: #261a2e; }
  #mode-badge.phase-game_over { border-color: #c44; color: #fcc; background: #2e1414; }
  #stage { position: relative; width: 100%; max-width: 480px; aspect-ratio: 10 / 9; margin-bottom: 6px; }
  #frame { width: 100%; height: 100%; image-rendering: pixelated; background: #000; display: block; }
  #overlay { position: absolute; left: 0; top: 0; width: 480px; height: 384px; display: none; transform-origin: 0 0; }
  #overlay div { position: absolute; box-sizing: border-box; width: 48px; height: 48px; border: 1px solid rgba(0, 0, 0, 0.25); }
  #overlay div.link { border: 3px solid #fff; }
  #legend, #map-legend { display: none; flex-wrap: wrap; gap: 4px 10px; padding: 2px 0; color: #aaa; }
  #map-legend { display: flex; }
  #legend i, #map-legend i, .swatch { display: inline-block; width: 10px; height: 10px; margin-right: 4px; vertical-align: middle; }
  #tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  #activity { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; padding: 6px 8px; margin-bottom: 6px; background: #1a2a22; border: 1px solid #2c4; }
  #activity.stopped { background: #2a1a1a; border-color: #a44; }
  #activity.idle { background: #1d1d1d; border-color: #444; }
  #dot { width: 10px; height: 10px; border-radius: 50%; background: #2c4; flex: none; animation: pulse 1.2s ease-in-out infinite; }
  #activity.stopped #dot, #activity.idle #dot { animation: none; background: #777; }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.7); } }
  @media (prefers-reduced-motion: reduce) { #dot { animation: none; } }
  #activity-label { font-size: 1.1em; color: #fff; }
  #activity-timer { font-size: 1.1em; color: #8f8; font-variant-numeric: tabular-nums; }
  #activity-detail { color: #9ab; flex-basis: 100%; }
  #objective-title { font-size: 1.15em; color: #fd8; }
  #goal, #plan { margin-top: 6px; color: #dfe; }
  #reasoning-text { font-size: 1.1em; line-height: 1.5; color: #eef; white-space: pre-wrap; }
  #events-head { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; color: #888; }
  #events { height: 260px; overflow-y: auto; background: #141414; padding: 4px; margin-top: 4px; white-space: pre-wrap; }
  #events .action { color: #999; }
  #events .decision { color: #dfe; }
  #events .objective { color: #fd8; }
  #events .dialogue { color: #9cf; }
  #events .reason { display: block; color: #8a9; margin: 0 0 4px 14px; font-size: 0.92em; white-space: pre-wrap; }
  #events .flash { background: #334; }
  #leads, #dialogues { margin: 0; padding-left: 16px; }
  #leads { color: #9cf; }
  #dialogues { max-height: 420px; overflow-y: auto; }
  #dialogues li { margin-bottom: 6px; }
  #dialogues .head { color: #9ab; }
  #dialogues .npc { color: #fd8; }
  #dialogues .text { color: #eef; white-space: pre-wrap; }
  #meter { height: 6px; background: #333; margin: 4px 0; }
  #meter-fill { height: 100%; width: 0; background: #2c4; }
  #meter-fill.high { background: #e83; }
  svg text { fill: #999; font: 10px monospace; }
  #cost-chart { width: 100%; height: 160px; display: block; margin-top: 6px; }
  #split { display: flex; height: 10px; margin: 6px 0 2px; background: #222; }
  #split span { display: block; height: 100%; }
  #split-legend, #usage { margin: 4px 0 0; padding: 0; list-style: none; columns: 2; column-gap: 12px; }
  #split-legend li, #usage li { break-inside: avoid; }
  #timeline { width: 100%; height: 130px; display: block; cursor: pointer; }
  #timeline-info { min-height: 1.4em; color: #dfe; }
  #timeline-skills { display: flex; flex-wrap: wrap; gap: 2px 12px; color: #aaa; }
  #map-wrap { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 10px; }
  @media (max-width: 900px) { #map-wrap { grid-template-columns: minmax(0, 1fr); } }
  #map { position: relative; overflow: auto; min-height: 120px; max-height: 520px; background: #141414; }
  #map-lines { position: absolute; left: 0; top: 0; }
  #map-lines line { stroke: #557; stroke-width: 2; }
  .node { position: absolute; box-sizing: border-box; width: 96px; height: 86px; padding: 3px 5px; background: #20232a; border: 1px solid #445;
          color: #ccd; font: inherit; text-align: left; cursor: pointer; overflow: hidden; }
  .node.current { border: 2px solid #fd8; }
  .node.attached { border-style: dashed; background: #1d2620; }
  #map-lines line.lane { stroke: #333; stroke-dasharray: 6 4; stroke-width: 1; }
  .node.picked { background: #2a3550; }
  .node small { display: block; color: #9ab; }
  .node.shot { padding: 0; }
  .node img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; image-rendering: pixelated; }
  .node .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 1px 3px; background: rgba(10, 10, 14, 0.72); color: #eef; font-size: 11px; white-space: nowrap; overflow: hidden; }
  #place-shot { display: none; margin: 4px 0; }
  #place-shot.on { display: block; }
  #place-shot-frame { position: relative; width: 100%; max-width: 480px; aspect-ratio: 10 / 9; background: #000; }
  #place-shot-frame img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; image-rendering: pixelated; }
  #place-shot-grid { display: none; position: absolute; left: 0; top: 0; width: 100%; height: 100%; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(8, 1fr); opacity: 0.85; pointer-events: none; }
  #place-shot-grid.on { display: grid; }
  #place-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 1px; max-width: 320px; aspect-ratio: 10 / 8; margin: 4px 0; }
  #place-grid i { display: block; }
  #place-people, #place-leads { margin: 2px 0; padding-left: 16px; }
  #header-block summary { cursor: pointer; color: #aaa; }
  #header-fields { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 12px; margin: 6px 0; }
  #header-fields dt { color: #888; }
  #header-fields dd { margin: 0; }
  #notes { width: 100%; box-sizing: border-box; min-height: 90px; background: #111; color: #ddd; border: 1px solid #444; font: inherit; }
</style>
</head>
<body>
<nav id="nav"><b>Koholint</b><a id="nav-live" href="/">Live</a><a id="nav-runs" href="/runs">Runs</a><a id="nav-compare" href="#" hidden>Compare</a><span id="nav-run"></span><span id="nav-badge" class="badge">replay</span></nav>
<div id="replay"><button id="play" type="button"></button><span id="speeds"></span><button id="star" type="button">★ Star</button><span id="replay-note"></span></div>
<div id="bar"></div>
<div id="banner">Replay diverged: the follower no longer matches the run.</div>
<div id="lost">Connection lost, retrying...</div>
<div id="alerts"></div>
<main id="blocks">
  <section class="block" id="game">
    <div id="activity" class="idle"><span id="dot"></span><span id="activity-label">Waiting for the engine...</span><span id="activity-timer"></span><span id="activity-detail"></span></div>
    <div id="game-head"><span id="mode-badge" class="badge phase-unknown">mode: unknown</span><span id="tools"><button id="grid" type="button"></button></span></div>
    <div id="stage"><img id="frame" alt="game frame"><div id="overlay"></div></div>
    <div id="legend"></div>
  </section>
  <section class="block" id="objective">
    <h2>Objective</h2>
    <div id="objective-title"></div><div id="objective-predicate" class="muted"></div><div id="objective-attempts" class="muted"></div>
    <div id="goal"></div><div id="plan"></div>
  </section>
  <section class="block" id="reasoning">
    <h2>Reasoning</h2>
    <div id="reasoning-head" class="muted"></div><div id="reasoning-text"></div>
    <div id="events-head"><span>events</span><button id="mode" type="button"></button></div>
    <div id="events"></div>
  </section>
  <section class="block" id="leads-block"><h2>Leads</h2><ul id="leads"></ul></section>
  <section class="block" id="dialogues-block"><h2>Dialogues</h2><ul id="dialogues"></ul></section>
  <section class="block" id="stats">
    <h2>Budget &amp; agent stats</h2>
    <div id="meter"><div id="meter-fill"></div></div><div id="budget-line" class="muted"></div>
    <svg id="cost-chart" viewBox="0 0 300 160" preserveAspectRatio="none" role="img" aria-label="cumulative dollars by frame"></svg>
    <div id="chart-note" class="muted"></div>
    <div id="split"></div><ul id="split-legend"></ul>
    <ul id="usage"></ul>
  </section>
  <section class="block wide" id="timeline-block">
    <h2>Timeline</h2>
    <svg id="timeline" viewBox="0 0 1000 130" preserveAspectRatio="none" role="img" aria-label="run timeline"></svg>
    <div id="timeline-info"></div><div id="timeline-skills"></div>
  </section>
  <section class="block wide" id="map-block">
    <h2>World map</h2>
    <div id="map-note" class="muted"></div>
    <div id="map-wrap">
      <div id="map"><svg id="map-lines"></svg></div>
      <div id="place"><div id="place-title"></div><div id="place-shot"><label><input type="checkbox" id="place-shot-overlay"> belief grid</label><div id="place-shot-frame"><img id="place-shot-img" alt="place screenshot"><div id="place-shot-grid"></div></div></div><div id="place-grid"></div><div id="map-legend"></div><ul id="place-people"></ul><ul id="place-leads"></ul></div>
    </div>
  </section>
  <details class="block wide" id="header-block">
    <summary id="header-line">Run</summary>
    <dl id="header-fields"></dl>
    <label for="notes">notes</label>
    <textarea id="notes" maxlength="8192" disabled></textarea>
    <div><button id="save-notes" type="button" disabled>Save notes</button> <span id="notes-status" class="muted"></span></div>
  </details>
</main>
<script>
(function () {
  // pure:begin
  function formatChoice(choice) {
    if (choice === null || choice === undefined) return '';
    if (typeof choice !== 'object') return String(choice);
    if (Array.isArray(choice.buttons)) {
      var pressed = choice.buttons.length ? choice.buttons.join('+') : 'idle';
      return choice.frames === undefined ? pressed : pressed + ' ' + choice.frames + 'f';
    }
    return JSON.stringify(choice);
  }

  function plural(n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); }

  function formatPlace(place) { return Array.isArray(place) ? '[' + place.join(',') + ']' : ''; }

  function formatParam(v) { return v !== null && typeof v === 'object' ? JSON.stringify(v) : String(v); }

  function formatCell(p) { return '(' + p.row + ', ' + p.col + ')'; }

  function formatSkillCall(skill, p) {
    p = p && typeof p === 'object' ? p : {};
    if (skill === 'goto' && Number.isInteger(p.row) && Number.isInteger(p.col)) return 'goto ' + formatCell(p);
    if (skill === 'step' && typeof p.direction === 'string' && Number.isInteger(p.pixels)) return 'step ' + p.direction + ' ' + p.pixels + ' px';
    return null;
  }

  function formatSkillChoice(choice) {
    var p = choice.params && typeof choice.params === 'object' ? choice.params : {};
    var named = formatSkillCall(choice.skill, p);
    if (named) return named;
    var keyed = choice.skill !== 'walk' && Object.keys(p).length > 1;
    var params = Object.keys(p).map(function (k) { return keyed ? k + '=' + formatParam(p[k]) : formatParam(p[k]); });
    return [choice.skill].concat(params).join(' ');
  }

  function formatDecisionChoice(choice) {
    if (choice && typeof choice === 'object' && typeof choice.skill === 'string') return formatSkillChoice(choice);
    if (choice && typeof choice === 'object' && typeof choice.title === 'string') return 'objective "' + choice.title + '"';
    return formatChoice(choice);
  }

  var PAST = { walk: 'walked' };

  function formatBlocked(b) {
    if (!b || typeof b !== 'object' || !Number.isInteger(b.row) || !Number.isInteger(b.col)) return '';
    return ', blocked at (' + b.row + ',' + b.col + ')' + (typeof b.direction === 'string' ? ' ' + b.direction : '');
  }

  function formatResult(e) {
    var r = e.result;
    var named = formatSkillCall(e.skill, e.params);
    var plain = named === null || e.skill === 'walk';
    var verb = PAST[e.skill] || e.skill;
    var line;
    if (e.skill === 'step' && typeof r.moved_px === 'number') line = 'moved ' + r.moved_px + ' px';
    else line = typeof r.moved_cells === 'number' ? (named ? 'walked' : verb) + ' ' + plural(r.moved_cells, 'cell') : verb;
    if (r.stopped_by) line += r.stopped_by === 'done' && plain ? ', done' : ', stopped: ' + r.stopped_by;
    line += formatBlocked(r.blocked_at);
    if (r.room_changed) line += ', room changed';
    if (typeof r.hp_delta === 'number' && r.hp_delta !== 0) line += ', hp ' + (r.hp_delta > 0 ? '+' : '') + r.hp_delta;
    return named ? named + ' · ' + line : line;
  }

  function truncate(value, max) {
    var str = String(value);
    return str.length > max ? str.slice(0, max - 1) + '…' : str;
  }

  function formatObjective(s) {
    var st = s.status || {};
    if (!st.objective) return 'none';
    return truncate(st.objective_title || st.objective, 40);
  }

  function formatDollars(value) { return '$' + (typeof value === 'number' ? value : 0).toFixed(2); }

  function formatCalls(s) { return (s.status && s.status.calls) || 0; }

  function formatEventPretty(e) {
    var head = 'f' + e.frame + ' · ';
    if (e.type === 'decision') {
      if (e.agent === 'delegated' && e.justification === 'automatic dialogue advance') return head + 'automatic dialogue advance';
      if (e.agent === 'delegated' && e.justification === 'locked: waiting for Link to be free') return head + 'locked: waiting for Link to be free';
      var line = head + (e.agent || '?') + ' decides';
      var choice = formatDecisionChoice(e.choice);
      if (choice) line += ' ' + choice;
      if (typeof e.confidence === 'number' && e.confidence < 1) line += ' (' + Math.round(e.confidence * 100) + '%)';
      if (e.fallback) line += ' [fallback]';
      return line;
    }
    if (e.type === 'action') {
      if (e.result && (e.result.stopped_by || typeof e.result.moved_cells === 'number' || typeof e.result.moved_px === 'number')) return head + formatResult(e);
      return head + e.skill + ' ' + formatChoice(e.params);
    }
    if (e.type === 'objective') {
      var p = e.predicate || {};
      var what = [p.kind || e.id, formatPlace(p.place)].filter(Boolean).join(' ');
      return head + 'objective: ' + what + ' ' + e.status + (e.reason ? ' (' + e.reason + ')' : '');
    }
    if (e.type === 'dialogue') return typeof e.text === 'string' ? head + 'dialogue: "' + truncate(e.text, 200) + '"' : head + 'dialogue';
    return head + e.type;
  }

  function eventTitle(e) {
    if (e.type === 'decision') return typeof e.justification === 'string' ? e.justification : '';
    if (e.type === 'objective') return typeof e.title === 'string' ? e.title : '';
    if (e.type === 'dialogue') return typeof e.text === 'string' ? e.text : '';
    return '';
  }

  function formatReason(e) {
    if (e.type !== 'decision' || typeof e.justification !== 'string') return '';
    return truncate(e.justification.trim(), 600);
  }

  function formatPlan(e) {
    if (e.type !== 'decision' || typeof e.plan !== 'string' || !e.plan.trim()) return '';
    return 'plan: ' + truncate(e.plan.trim(), 200);
  }

  function formatEventJson(e) { return JSON.stringify(e); }

  function normalizeMode(mode) { return mode === 'json' ? 'json' : 'pretty'; }

  function nextMode(mode) { return normalizeMode(mode) === 'json' ? 'pretty' : 'json'; }

  function formatHearts(s) {
    var hearts = s.status.hearts, max = s.status.max_hearts;
    if (hearts === null || hearts === undefined || !max) return '-';
    return hearts + '/' + max;
  }

  var CELL = 48;
  var COLORS = {
    yes: 'rgba(60, 200, 80, 0.40)', no: 'rgba(230, 50, 50, 0.45)', mixed: 'rgba(170, 80, 220, 0.45)',
    stale: 'rgba(240, 150, 30, 0.45)', unknown: 'rgba(150, 150, 150, 0.30)'
  };
  var STATES = ['yes', 'no', 'mixed', 'stale', 'unknown'];
  var STATE_WORDS = { yes: 'free', no: 'blocked', mixed: 'mixed', stale: 'doubtful', unknown: 'unknown' };

  function cellColor(state) { return COLORS[state] || COLORS.unknown; }

  function cellRect(row, col) { return { left: col * CELL, top: row * CELL, size: CELL }; }

  function gridExtent(rows, cols) { return { width: cols * CELL, height: rows * CELL }; }

  function cellTitle(row, col, appearance, state) { return row + ',' + col + ' ' + appearance + ' ' + state; }

  function legendEntries() {
    return STATES.map(function (state) { return { state: state, color: cellColor(state), word: STATE_WORDS[state] }; });
  }

  function gridButtonLabel(on, grid) {
    if (!grid) return 'Grid (no data)';
    return on ? 'Grid: on' : 'Grid: off';
  }

  function formatElapsed(ms) {
    var total = Math.max(0, Number(ms) || 0);
    if (total < 60000) return (Math.floor(total / 100) / 10).toFixed(1) + ' s';
    var seconds = Math.floor(total / 1000);
    var rest = seconds % 60;
    return Math.floor(seconds / 60) + ' min ' + (rest < 10 ? '0' : '') + rest + ' s';
  }

  var ACTIVITY_KINDS = {
    deciding: 'Deciding', reading_dialogue: 'Reading dialogue', mapping: 'Mapping the screen',
    acting: 'Acting', pacing: 'Pacing', idle: 'Idle', stopped: 'Stopped'
  };

  function activityLabel(a) {
    if (!a || typeof a !== 'object') return 'Waiting for the engine...';
    if (typeof a.label === 'string' && a.label) return a.label;
    return ACTIVITY_KINDS[a.kind] || (typeof a.kind === 'string' && a.kind ? a.kind : 'Working');
  }

  function elapsedSince(a, serverNow, receivedAt, now) {
    if (!a || typeof a.started_at !== 'number' || typeof serverNow !== 'number') return 0;
    return Math.max(0, serverNow * 1000 + (now - receivedAt) - a.started_at * 1000);
  }

  function formatLastCall(latency) {
    if (!latency || typeof latency.last_ms !== 'number') return '';
    return 'last call ' + formatElapsed(latency.last_ms);
  }

  function activityDetail(a, latency) {
    if (!a || typeof a !== 'object') return '';
    var d = a.detail && typeof a.detail === 'object' ? a.detail : {};
    var parts = [];
    if (a.kind === 'stopped') return typeof d.reason === 'string' ? 'reason: ' + d.reason : '';
    if (a.kind === 'deciding' || a.kind === 'reading_dialogue') {
      if (d.model) parts.push('model ' + d.model);
      if (Number.isInteger(d.images)) parts.push(plural(d.images, 'image'));
      var hint = formatLastCall(latency);
      if (hint) parts.push(hint);
    } else if (typeof d.skill === 'string') {
      var params = d.params && typeof d.params === 'object' && Object.keys(d.params).length ? ' ' + JSON.stringify(d.params) : '';
      parts.push(d.skill + params);
    }
    return parts.join(' · ');
  }

  function predicateInWords(p) {
    if (!p || typeof p !== 'object') return '';
    var place = Array.isArray(p.place) ? ' ' + formatPlace(p.place) : '';
    if (p.kind === 'reach_cell') return 'reach cell (' + p.row + ', ' + p.col + ') in' + place;
    if (p.kind === 'reach_place') return 'reach' + place;
    if (p.kind === 'leave_place') return 'leave' + place;
    if (p.kind === 'dialogue_closed') return 'close the open dialogue';
    if (p.kind === 'new_text') return 'read a new text';
    return typeof p.kind === 'string' ? p.kind.replace(/_/g, ' ') + place : '';
  }

  function meterPercent(spent, cap) {

  function checked(r) {
    if (r.ok) return r;
    return r.json().catch(function () { return {}; }).then(function (body) { throw new Error(body.error || r.status); });
  }

  function updateLost() {
    lost.style.display = (frameOk && stateOk) ? 'none' : 'block';
    var error = stateError || frameError;
    lost.textContent = error ? 'Server error: ' + error : 'Connection lost, retrying...';
  }

  function messageOf(e) { return (e instanceof TypeError) ? null : e.message; }

  function pollFrame() {
    if (frameBusy) return;
    frameBusy = true;
    counter += 1;
    fetch(withRun('/frame.png?t=' + counter, runId), { cache: 'no-store' })
      .then(checked).then(function (r) { return r.blob(); })
      .then(function (blob) {
        var old = img.src;
        img.src = URL.createObjectURL(blob);
        if (old.indexOf('blob:') === 0) URL.revokeObjectURL(old);
        frameOk = true;
        frameError = null;
      })
      .catch(function (e) { frameOk = false; frameError = messageOf(e); })
      .then(function () { frameBusy = false; updateLost(); });
  }

  function pollState() {
    if (stateBusy) return;
    stateBusy = true;
    fetch(withRun('/state.json', runId), { cache: 'no-store' })
      .then(checked).then(function (r) { return r.json(); })
      .then(function (state) {
        shownFrame = state.replay && Number.isInteger(state.replay.frame) ? state.replay.frame : shownFrame;
        journalFrames = state.replay && Number.isInteger(state.replay.journal_frames) ? state.replay.journal_frames : journalFrames;
        renderNav(state.status); renderBar(state); renderMode(state.status); renderActivity(state); renderPanels(state);
        renderEvents(state.events || []); renderGrid(state.grid || null); renderCursor();
        stateOk = true; stateError = null;
      })
      .catch(function (e) { stateOk = false; stateError = messageOf(e); })
      .then(function () { stateBusy = false; updateLost(); });
  }

  var busy = {};

  function poll(path, render) {
    if (busy[path]) return;
    busy[path] = true;
    fetch(withRun(path, runId), { cache: 'no-store' })
      .then(checked).then(function (r) { return r.json(); })
      .then(render)
      .catch(function () { /* the state poll reports connection problems */ })
      .then(function () { busy[path] = false; });
  }

  var activityState = { activity: null, serverNow: null, receivedAt: 0, latency: null };
  var activityEl = document.getElementById('activity');
  var activityLabelEl = document.getElementById('activity-label');
  var activityTimerEl = document.getElementById('activity-timer');
  var activityDetailEl = document.getElementById('activity-detail');

  function renderActivity(state) {
    if (runId) {
      renderReplay(state.replay || {});
      activityState = { activity: null };
      activityEl.className = 'idle';
      activityLabelEl.textContent = replayLabel(state.replay);
      activityDetailEl.textContent = '';
      activityTimerEl.textContent = '';
      return;
    }
    activityState = { activity: effectiveActivity(state.activity, (state.status || {}).manifest_status), serverNow: state.server_now, receivedAt: Date.now(), latency: state.latency || null };
    var a = activityState.activity;
    activityEl.className = a && (a.kind === 'stopped' || a.kind === 'idle') ? a.kind : '';
    activityLabelEl.textContent = activityLabel(a);
    activityDetailEl.textContent = activityDetail(a, activityState.latency);
    tickActivity();
  }

  function tickActivity() {
    var a = activityState.activity;
    if (!a || a.kind === 'stopped' || a.kind === 'idle') { activityTimerEl.textContent = ''; return; }
    activityTimerEl.textContent = formatElapsed(elapsedSince(a, activityState.serverNow, activityState.receivedAt, Date.now()));
  }

  function fillList(id, texts) {
    var list = document.getElementById(id);
    list.replaceChildren();
    texts.forEach(function (text) {
      var item = document.createElement('li');
      item.textContent = text;
      list.appendChild(item);
    });
  }

  function renderPanels(state) {
    var list = state.events || [];
    var reasoning = latestReasoning(list);
    document.getElementById('reasoning-head').textContent = reasoning ? reasoningHead(reasoning) : '';
    document.getElementById('reasoning-text').textContent = reasoning ? reasoning.justification.trim() : 'No agent decision yet.';
    document.getElementById('plan').textContent = reasoning && typeof reasoning.plan === 'string' ? 'plan: ' + reasoning.plan.trim() : '';
    var objective = objectiveView(state.status);
    document.getElementById('objective-title').textContent = objective ? objective.title : 'none';
    document.getElementById('objective-predicate').textContent = objective ? objective.predicate : '';
    document.getElementById('objective-attempts').textContent = objective ? (objective.attempts === null ? '' : plural(objective.attempts, 'skill call') + ' so far') : '';
    var memory = memoryView(state.status);
    document.getElementById('goal').textContent = memory.goal;
    fillList('leads', memory.leads.length ? memory.leads : ['no lead yet']);
    var dialoguesEl = document.getElementById('dialogues');
    dialoguesEl.replaceChildren();
    dialoguesView(state.dialogues).forEach(function (d) {
      var item = document.createElement('li');
      var head = document.createElement('div');
      head.className = 'head';
      head.textContent = d.head;
      item.appendChild(head);
      if (d.npc) {
        var npc = document.createElement('div');
        npc.className = 'npc';
        npc.textContent = d.npc;
        item.appendChild(npc);
      }
      var text = document.createElement('div');
      text.className = 'text';
      text.textContent = d.text;
      item.appendChild(text);
      dialoguesEl.appendChild(item);
    });
    var budget = state.budget || {};
    var percent = meterPercent(budget.spent, budget.cap);
    document.getElementById('meter').style.display = percent === null ? 'none' : 'block';
    var fill = document.getElementById('meter-fill');
    fill.style.width = (percent || 0) + '%';
    fill.className = percent !== null && percent >= 80 ? 'high' : '';
    document.getElementById('budget-line').textContent = formatBudgetLine(budget, state.latency);
  }

  var CHART_W = 300, CHART_H = 160;

  function renderStats(stats) {
    var chart = document.getElementById('cost-chart');
    chart.replaceChildren();
    var scale = chartScale(stats);
    var ref = stats.reference && typeof stats.reference === 'object' ? stats.reference : null;
    [0.5, 1].forEach(function (f) {
      chart.appendChild(svgNode('line', { x1: 0, x2: CHART_W, y1: CHART_H - f * CHART_H + 0.5, y2: CHART_H - f * CHART_H + 0.5, stroke: '#2a2a2a' }));
    });
    if (ref) chart.appendChild(svgNode('polyline', { points: seriesPoints(ref.series, scale.frames, scale.usd, CHART_W, CHART_H), fill: 'none', stroke: '#777', 'stroke-width': 1.5, 'stroke-dasharray': '4 3', 'vector-effect': 'non-scaling-stroke' }));
    chart.appendChild(svgNode('polyline', { points: seriesPoints(stats.series, scale.frames, scale.usd, CHART_W, CHART_H), fill: 'none', stroke: '#8f8', 'stroke-width': 2, 'vector-effect': 'non-scaling-stroke' }));
    var top = svgNode('text', { x: 2, y: 10 });
    top.textContent = '$' + scale.usd.toFixed(2);
    chart.appendChild(top);
    var right = svgNode('text', { x: CHART_W - 2, y: CHART_H - 2, 'text-anchor': 'end' });
    right.textContent = 'f' + scale.frames;
    chart.appendChild(right);
    document.getElementById('chart-note').textContent = 'cumulative $ by frame: $' + lastValue(stats.series).toFixed(3) + ' now' +
      (ref ? ' · grey: ' + ref.run_id + ' ($' + lastValue(ref.series).toFixed(3) + ')' : '');
    var split = document.getElementById('split');
    split.replaceChildren();
    var rows = splitView(stats.by_skill);
    rows.forEach(function (r) {
      var part = document.createElement('span');
      part.style.width = r.percent + '%';
      part.style.background = r.color;
      part.title = r.text;
      split.appendChild(part);
    });
    var legendEl = document.getElementById('split-legend');
    legendEl.replaceChildren();
    rows.forEach(function (r) {
      var item = document.createElement('li');
      item.append(swatch(r.color), r.text);
      legendEl.appendChild(item);
    });
    fillList('usage', usageRows(stats));
  }

  var TL_W = 1000, TL_H = 130;
  var lastTimeline = null;

  function renderTimeline(timeline) {
    lastTimeline = timeline;
    var svg = document.getElementById('timeline');
    svg.replaceChildren();
    var lane = (TL_H - 14) / LANES.length;
    LANES.forEach(function (name, i) {
      var label = svgNode('text', { x: 2, y: Math.round(i * lane + lane - 3) });
      label.textContent = name;
      svg.appendChild(label);
    });
    var info = document.getElementById('timeline-info');
    timelineMarks(timeline, TL_W, TL_H).forEach(function (m) {
      var rect = svgNode('rect', { x: m.x, y: m.y, width: m.w, height: m.h, fill: m.color, tabindex: 0 });
      var title = svgNode('title', {});
      title.textContent = m.label;
      rect.appendChild(title);
      var show = function () { info.textContent = m.label; };
      rect.addEventListener('mouseenter', show);
      rect.addEventListener('focus', show);
      rect.addEventListener('click', function (event) { event.stopPropagation(); jump(m.frame); });
      rect.addEventListener('keydown', function (event) { if (event.key === 'Enter') jump(m.frame); });
      svg.appendChild(rect);
    });
    svg.appendChild(svgNode('line', { id: 'cursor', x1: 0, x2: 0, y1: 0, y2: TL_H, stroke: '#fff', 'stroke-width': 1, 'vector-effect': 'non-scaling-stroke' }));
    var axis = svgNode('text', { x: TL_W - 2, y: TL_H - 2, 'text-anchor': 'end' });
    axis.textContent = 'f' + (timeline.frames || 0) + (timeline.total > (timeline.markers || []).length ? ' · ' + timeline.total + ' events clustered' : '');
    svg.appendChild(axis);
    var skills = document.getElementById('timeline-skills');
    skills.replaceChildren();
    var seen = {};
    (timeline.markers || []).forEach(function (m) {
      if (m && m.kind === 'call' && typeof m.skill === 'string' && !seen[m.skill]) {
        seen[m.skill] = true;
        var item = document.createElement('span');
        item.append(swatch(skillColor(m.skill)), m.skill);
        skills.appendChild(item);
      }
    });
    renderCursor();
  }

  function renderCursor() {
    var cursor = document.getElementById('cursor');
    if (!cursor || !lastTimeline) return;
    var x = markerX(shownFrame, lastTimeline.frames, TL_W);
    cursor.setAttribute('x1', String(x));
    cursor.setAttribute('x2', String(x));
  }

  document.getElementById('timeline').addEventListener('click', function (event) {
    if (!lastTimeline || !(lastTimeline.frames > 0)) return;
    var box = event.currentTarget.getBoundingClientRect();
    if (!(box.width > 0)) return;
    jump(Math.round((event.clientX - box.left) / box.width * lastTimeline.frames));
  });

  function jump(frame) {
    if (runId) { control('seek=' + Math.max(0, Math.min(frame, journalFrames === null ? frame : journalFrames))); return; }
    var rows = events.querySelectorAll('[data-frame]');
    var best = null;
    Array.prototype.forEach.call(rows, function (row) { if (Number(row.dataset.frame) <= frame) best = row; });
    if (!best) best = rows[0];
    if (!best) return;
    events.scrollTop = best.offsetTop - events.offsetTop;
    best.classList.add('flash');
    setTimeout(function () { best.classList.remove('flash'); }, 1500);
  }

  var picked = null, lastMap = null;

  function renderMap(map) {
    lastMap = map;
    var view = mapView(map);
    var box = document.getElementById('map');
    var lines = document.getElementById('map-lines');
    Array.prototype.slice.call(box.querySelectorAll('.node')).forEach(function (node) { node.remove(); });
    lines.replaceChildren();
    lines.setAttribute('width', String(view.width));
    lines.setAttribute('height', String(view.height));
    box.style.height = view.height ? Math.min(view.height, 520) + 'px' : '';
    if (view.lane !== null) lines.appendChild(svgNode('line', { x1: 0, x2: view.width, y1: view.lane, y2: view.lane, class: 'lane' }));
    view.lines.forEach(function (l) {
      var line = svgNode('line', { x1: l.x1, y1: l.y1, x2: l.x2, y2: l.y2 });
      if (l.count > 1) line.setAttribute('stroke-width', String(Math.min(2 + l.count, 6)));
      lines.appendChild(line);
    });
    if (picked === null && map.current) picked = placeKey(map.current);
    view.nodes.forEach(function (n) {
      var b = view.boxes[placeKey(n.place)];
      var node = document.createElement('button');
      node.type = 'button';
      node.className = 'node' + (n.kind && n.kind !== 'world' ? ' attached' : '') + (n.current ? ' current' : '') + (placeKey(n.place) === picked ? ' picked' : '');
      node.style.left = b.left + 'px';
      node.style.top = b.top + 'px';
      var text = nodeLines(n);
      var shot = screenshotUrl(n);
      if (shot) {
        var thumb = document.createElement('img');
        thumb.src = withRun(shot, runId);
        thumb.alt = '';
        var cap = document.createElement('span');
        cap.className = 'cap';
        cap.textContent = text.title;
        node.classList.add('shot');
        node.append(thumb, cap);
      } else {
        var detail = document.createElement('small');
        detail.textContent = text.detail;
        node.append(text.title, detail);
      }
      node.title = nodeTip(n);
      node.addEventListener('click', function () { picked = placeKey(n.place); renderMap(lastMap); });
      box.appendChild(node);
    });
    document.getElementById('map-note').textContent = view.nodes.length ? plural(view.nodes.length, 'place') + ' at f' + map.frame + (map.truncated ? ' (first places only)' : '') : 'No place visited yet.';
    renderPlace(view.nodes.filter(function (n) { return placeKey(n.place) === picked; })[0]);
  }

  function renderShot(node) {
    var box = document.getElementById('place-shot');
    var img = document.getElementById('place-shot-img');
    var overlay = document.getElementById('place-shot-grid');
    var url = screenshotUrl(node);
    box.classList.toggle('on', url !== null);
    overlay.replaceChildren();
    if (url === null) return;
    var src = withRun(url, runId);
    if (img.getAttribute('src') !== src) img.src = src;
    overlay.classList.toggle('on', document.getElementById('place-shot-overlay').checked);
    (Array.isArray(node.cells) ? node.cells : []).forEach(function (cells) {
      (Array.isArray(cells) ? cells : []).forEach(function (state) {
        var cell = document.createElement('i');
        if (state && state !== 'unknown') cell.style.background = cellColor(state);
        overlay.appendChild(cell);
      });
    });
  }

  document.getElementById('place-shot-overlay').addEventListener('change', function () { if (lastMap) renderMap(lastMap); });

  function renderPlace(node) {
    var grid = document.getElementById('place-grid');
    grid.replaceChildren();
    document.getElementById('place-title').textContent = node ? nodeLines(node).title + ' · ' + nodeLines(node).detail : 'Pick a place.';
    if (node && Array.isArray(node.cells)) {
      node.cells.forEach(function (cells, row) {
        (Array.isArray(cells) ? cells : []).forEach(function (state, col) {
          var cell = document.createElement('i');
          cell.style.background = cellColor(state);
          cell.title = row + ',' + col + ' ' + (STATE_WORDS[state] || 'unknown');
          grid.appendChild(cell);
        });
      });
    }
    renderShot(node);
    fillList('place-people', node && Array.isArray(node.people) ? node.people.map(personText) : []);
    fillList('place-leads', node && Array.isArray(node.leads) ? node.leads.map(function (l) { return '[' + String(l.importance || '?') + '] ' + truncate(l.claim, 160); }) : []);
  }

  var notesRun = null, notesLoaded = false;
  var notesEl = document.getElementById('notes');
  var saveButton = document.getElementById('save-notes');
  var notesStatus = document.getElementById('notes-status');

  function renderHeader(h) {
    document.getElementById('header-line').textContent = headerLine(h);
    var dl = document.getElementById('header-fields');
    dl.replaceChildren();
    headerRows(h).forEach(function (row) {
      var dt = document.createElement('dt');
      dt.textContent = row.label;
      var dd = document.createElement('dd');
      dd.textContent = row.text;
      dl.append(dt, dd);
    });
    notesRun = typeof h.notes_run === 'string' ? h.notes_run : null;
    notesEl.disabled = !notesRun;
    saveButton.disabled = !notesRun;
    if (!notesRun) notesStatus.textContent = 'notes are kept only for runs under the runs root';
    if (!notesLoaded) { notesEl.value = typeof h.notes === 'string' ? h.notes : ''; notesLoaded = true; }
  }

  saveButton.addEventListener('click', function () {
    if (!notesRun) return;
    notesStatus.textContent = 'saving...';
    fetch(withRun('/notes', notesRun), { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'text=' + encodeURIComponent(notesEl.value) })
      .then(checked).then(function () { notesStatus.textContent = 'saved'; })
      .catch(function (e) { notesStatus.textContent = 'save failed: ' + (messageOf(e) || 'connection lost'); });
  });

  var replayEl = document.getElementById('replay');
  var playButton = document.getElementById('play');
  var speedsEl = document.getElementById('speeds');
  var replayNote = document.getElementById('replay-note');
  var replayControls = { speed: 1, paused: false };

  function control(query) {
    fetch(withRun('/control?' + query, runId), { cache: 'no-store' })
      .then(checked).then(function (r) { return r.json(); })
      .then(function (controls) {
        renderReplay(controls);
        if (Number.isInteger(controls.frame)) { shownFrame = controls.frame; renderCursor(); }
        replayNote.textContent = '';
      })
      .catch(function (e) { replayNote.textContent = 'control failed: ' + (messageOf(e) || 'connection lost'); });
  }

  function renderReplay(replay) {
    if (typeof replay.speed === 'number') replayControls.speed = replay.speed;
    if (typeof replay.paused === 'boolean') replayControls.paused = replay.paused;
    playButton.textContent = replayControls.paused ? 'Play' : 'Pause';
    Array.prototype.forEach.call(speedsEl.children, function (button) {
      button.className = Number(button.dataset.speed) === replayControls.speed ? 'on' : '';
    });
  }

  function starRun() {
    var why = window.prompt('Why star this run?');
    if (!why || !why.trim()) return;
    fetch(withRun('/star', runId), { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'why=' + encodeURIComponent(why.trim()) })
      .then(checked).then(function () { replayNote.textContent = 'starred'; })
      .catch(function (e) { replayNote.textContent = 'star failed: ' + (messageOf(e) || 'connection lost'); });
  }

  if (runId) {
    document.title = 'Koholint replay';
    replayEl.style.display = 'flex';
    SPEEDS.forEach(function (speed) {
      var button = document.createElement('button');
      button.type = 'button';
      button.dataset.speed = String(speed);
      button.textContent = speed + 'x';
      button.addEventListener('click', function () { control('speed=' + speed); });
      speedsEl.appendChild(button);
    });
    playButton.addEventListener('click', function () { control('pause=' + (replayControls.paused ? '0' : '1')); });
    document.getElementById('star').addEventListener('click', starRun);
    renderReplay(replayControls);
  }
  renderNav(null);

  setInterval(tickActivity, 100);
  window.addEventListener('resize', fitOverlay);
  if (window.ResizeObserver) new window.ResizeObserver(fitOverlay).observe(stage);
  fitOverlay();

  function pollMap() { poll('/map.json', renderMap); }
  function pollStats() { poll('/stats.json', renderStats); }
  function pollTimeline() { poll('/timeline.json', renderTimeline); }
  function pollHeader() { poll('/header.json', renderHeader); }

  setInterval(pollFrame, 100);
  setInterval(pollState, 500);
  setInterval(pollMap, 2000);
  setInterval(pollStats, 3000);
  setInterval(pollTimeline, 5000);
  setInterval(pollHeader, 10000);
  pollFrame();
  pollState();
  pollMap();
  pollStats();
  pollTimeline();
  pollHeader();
})();
</script>
</body>
</html>
