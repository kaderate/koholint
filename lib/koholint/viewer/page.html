<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Koholint live</title>
<style>
  body { margin: 0; background: #111; color: #ddd; font: 13px/1.4 monospace; }
  #bar { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 8px 12px; background: #222; }
  #bar b { color: #8f8; font-weight: normal; }
  #bar b.health-unknown { color: #aaa; }
  #banner, #lost { display: none; padding: 8px 12px; font-weight: bold; color: #fff; }
  #banner { background: #b00; }
  #lost { background: #a60; }
  #main { display: flex; gap: 12px; padding: 12px; align-items: flex-start; }
  #stage { position: relative; width: 480px; height: 432px; flex: none; }
  #frame { width: 480px; height: 432px; image-rendering: pixelated; background: #000; display: block; }
  #overlay { position: absolute; left: 0; top: 0; width: 480px; height: 384px; display: none; }
  #overlay div { position: absolute; box-sizing: border-box; width: 48px; height: 48px; border: 1px solid rgba(0, 0, 0, 0.25); }
  #overlay div.link { border: 3px solid #fff; }
  #legend { display: none; gap: 10px; padding: 4px 6px; background: #222; }
  #legend i { display: inline-block; width: 10px; height: 10px; margin-right: 4px; }
  #grid { background: #333; color: #ddd; border: 1px solid #555; font: inherit; padding: 2px 10px; cursor: pointer; }
  #grid:disabled { color: #777; cursor: default; }
  #side { flex: 1; display: flex; flex-direction: column; }
  #sidebar { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px; background: #222; }
  #mode { background: #333; color: #ddd; border: 1px solid #555; font: inherit; padding: 2px 10px; cursor: pointer; }
  #events { height: 400px; overflow-y: auto; background: #181818; padding: 6px; margin: 0; white-space: pre-wrap; }
  #events .action { color: #999; }
  #events .decision { color: #dfe; }
  #events .objective { color: #fd8; }
  #events .dialogue { color: #9cf; }
</style>
</head>
<body>
<div id="bar"></div>
<div id="banner">Replay diverged: the follower no longer matches the run.</div>
<div id="lost">Connection lost, retrying...</div>
<div id="main">
  <div id="stage"><img id="frame" alt="game frame"><div id="overlay"></div></div>
  <div id="side">
    <div id="sidebar"><span>events</span><span><button id="grid" type="button"></button> <button id="mode" type="button"></button></span></div>
    <div id="legend"></div>
    <div id="events"></div>
  </div>
</div>
<script>
(function () {
  // pure:begin
  function formatChoice(choice) {
    if (choice === null || choice === undefined) return '';
    if (typeof choice !== 'object') return String(choice);
    if (Array.isArray(choice.buttons)) {
      var pressed = choice.buttons.length ? choice.buttons.join('+') : 'idle';
      return choice.frames === undefined ? pressed : pressed + ' ' + choice.frames + 'f';
    }
    return JSON.stringify(choice);
  }

  function plural(n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); }

  function formatPlace(place) { return Array.isArray(place) ? '[' + place.join(',') + ']' : ''; }

  function formatParam(v) { return v !== null && typeof v === 'object' ? JSON.stringify(v) : String(v); }

  function formatSkillChoice(choice) {
    var p = choice.params && typeof choice.params === 'object' ? choice.params : {};
    var keyed = choice.skill !== 'walk' && Object.keys(p).length > 1;
    var params = Object.keys(p).map(function (k) { return keyed ? k + '=' + formatParam(p[k]) : formatParam(p[k]); });
    return [choice.skill].concat(params).join(' ');
  }

  function formatDecisionChoice(choice) {
    if (choice && typeof choice === 'object' && typeof choice.skill === 'string') return formatSkillChoice(choice);
    if (choice && typeof choice === 'object' && typeof choice.title === 'string') return 'objective "' + choice.title + '"';
    return formatChoice(choice);
  }

  var PAST = { walk: 'walked' };

  function formatResult(e) {
    var r = e.result;
    var verb = PAST[e.skill] || e.skill;
    var line = typeof r.moved_cells === 'number' ? verb + ' ' + plural(r.moved_cells, 'cell') : verb;
    if (r.stopped_by) line += r.stopped_by === 'done' ? ', done' : ', stopped: ' + r.stopped_by;
    if (r.room_changed) line += ', room changed';
    if (typeof r.hp_delta === 'number' && r.hp_delta !== 0) line += ', hp ' + (r.hp_delta > 0 ? '+' : '') + r.hp_delta;
    return line;
  }

  function truncate(value, max) {
    var str = String(value);
    return str.length > max ? str.slice(0, max - 1) + '…' : str;
  }

  function formatObjective(s) {
    var st = s.status || {};
    if (!st.objective) return 'none';
    return truncate(st.objective_title || st.objective, 40);
  }

  function formatDollars(value) { return '$' + (typeof value === 'number' ? value : 0).toFixed(2); }

  function formatCalls(s) { return (s.status && s.status.calls) || 0; }

  function formatEventPretty(e) {
    var head = 'f' + e.frame + ' · ';
    if (e.type === 'decision') {
      var line = head + (e.agent || '?') + ' decides';
      var choice = formatDecisionChoice(e.choice);
      if (choice) line += ' ' + choice;
      if (typeof e.confidence === 'number' && e.confidence < 1) line += ' (' + Math.round(e.confidence * 100) + '%)';
      if (e.fallback) line += ' [fallback]';
      return line;
    }
    if (e.type === 'action') {
      if (e.result && (e.result.stopped_by || typeof e.result.moved_cells === 'number')) return head + formatResult(e);
      return head + e.skill + ' ' + formatChoice(e.params);
    }
    if (e.type === 'objective') {
      var p = e.predicate || {};
      var what = [p.kind || e.id, formatPlace(p.place)].filter(Boolean).join(' ');
      return head + 'objective: ' + what + ' ' + e.status + (e.reason ? ' (' + e.reason + ')' : '');
    }
    if (e.type === 'dialogue') return typeof e.text === 'string' ? head + 'dialogue: "' + truncate(e.text, 200) + '"' : head + 'dialogue';
    return head + e.type;
  }

  function eventTitle(e) {
    if (e.type === 'decision') return typeof e.justification === 'string' ? e.justification : '';
    if (e.type === 'objective') return typeof e.title === 'string' ? e.title : '';
    if (e.type === 'dialogue') return typeof e.text === 'string' ? e.text : '';
    return '';
  }

  function formatEventJson(e) { return JSON.stringify(e); }

  function normalizeMode(mode) { return mode === 'json' ? 'json' : 'pretty'; }

  function nextMode(mode) { return normalizeMode(mode) === 'json' ? 'pretty' : 'json'; }

  function formatHearts(s) {
    var hearts = s.status.hearts, max = s.status.max_hearts;
    if (hearts === null || hearts === undefined || !max) return '-';
    return hearts + '/' + max;
  }

  var CELL = 48;
  var COLORS = {
    yes: 'rgba(60, 200, 80, 0.40)', no: 'rgba(230, 50, 50, 0.45)', mixed: 'rgba(170, 80, 220, 0.45)',
    stale: 'rgba(240, 150, 30, 0.45)', unknown: 'rgba(150, 150, 150, 0.30)'
  };
  var STATES = ['yes', 'no', 'mixed', 'stale', 'unknown'];

  function cellColor(state) { return COLORS[state] || COLORS.unknown; }

  function cellRect(row, col) { return { left: col * CELL, top: row * CELL, size: CELL }; }

  function gridExtent(rows, cols) { return { width: cols * CELL, height: rows * CELL }; }

  function cellTitle(row, col, appearance, state) { return row + ',' + col + ' ' + appearance + ' ' + state; }

  function legendEntries() {
    return STATES.map(function (state) { return { state: state, color: cellColor(state) }; });
  }

  function gridButtonLabel(on, grid) {
    if (!grid) return 'Grid (no data)';
    return on ? 'Grid: on' : 'Grid: off';
  }
  // pure:end

  var fields = [
    ['run', function (s) { return s.status.run_id; }],
    ['flow', function (s) { return s.status.flow_version; }],
    ['health', function (s) { return s.status.health; }],
    ['hearts', formatHearts],
    ['objective', formatObjective],
    ['spent', function (s) { return formatDollars(s.status.cost_usd); }],
    ['calls', formatCalls],
    ['frame', function (s) { return s.replay.frame; }],
    ['lag', function (s) { return s.replay.lag; }],
    ['sync', function (s) { return s.replay.sync; }],
    ['budget', function (s) { return s.status.budget; }],
    ['manifest', function (s) { return s.status.manifest_status; }]
  ];
  var bar = document.getElementById('bar');
  var banner = document.getElementById('banner');
  var lost = document.getElementById('lost');
  var events = document.getElementById('events');
  var img = document.getElementById('frame');
  var modeButton = document.getElementById('mode');
  var gridButton = document.getElementById('grid');
  var overlay = document.getElementById('overlay');
  var legend = document.getElementById('legend');
  var gridOn = storedGrid();
  var lastGrid = null, lastGridKey = null;
  var counter = 0, frameBusy = false, stateBusy = false, frameOk = true, stateOk = true;
  var frameError = null, stateError = null;
  var mode = normalizeMode(storedMode());
  var lastList = [];

  function storedMode() {
    try { return window.localStorage.getItem('koholint.events.mode'); } catch (e) { return null; }
  }

  function storeMode(value) {
    try { window.localStorage.setItem('koholint.events.mode', value); } catch (e) { /* private mode */ }
  }

  function storedGrid() {
    try { return window.localStorage.getItem('koholint.grid') === 'on'; } catch (e) { return false; }
  }

  function storeGrid(value) {
    try { window.localStorage.setItem('koholint.grid', value ? 'on' : 'off'); } catch (e) { /* private mode */ }
  }

  function renderLegend() {
    legend.textContent = '';
    legendEntries().forEach(function (entry) {
      var item = document.createElement('span');
      var swatch = document.createElement('i');
      swatch.style.background = entry.color;
      item.append(swatch, entry.state);
      legend.appendChild(item);
    });
  }

  function renderGrid(grid) {
    lastGrid = grid;
    gridButton.disabled = !grid;
    gridButton.textContent = gridButtonLabel(gridOn, grid);
    var visible = Boolean(grid) && gridOn;
    overlay.style.display = visible ? 'block' : 'none';
    legend.style.display = visible ? 'flex' : 'none';
    var key = visible ? JSON.stringify(grid) : null;
    if (key === lastGridKey) return;
    lastGridKey = key;
    overlay.textContent = '';
    if (!visible) return;
    var extent = gridExtent(grid.cells.length, grid.cells[0].length);
    overlay.style.width = extent.width + 'px';
    overlay.style.height = extent.height + 'px';
    grid.cells.forEach(function (cells, row) {
      cells.forEach(function (state, col) {
        var rect = cellRect(row, col);
        var cell = document.createElement('div');
        cell.style.left = rect.left + 'px';
        cell.style.top = rect.top + 'px';
        cell.style.width = rect.size + 'px';
        cell.style.height = rect.size + 'px';
        cell.style.background = cellColor(state);
        cell.title = cellTitle(row, col, grid.appearances[row][col], state);
        if (grid.link && grid.link.row === row && grid.link.col === col) cell.className = 'link';
        overlay.appendChild(cell);
      });
    });
  }

  gridButton.addEventListener('click', function () {
    gridOn = !gridOn;
    storeGrid(gridOn);
    renderGrid(lastGrid);
  });
  renderLegend();
  renderGrid(null);

  function text(value) {
    if (value === null || value === undefined) return '-';
    return typeof value === 'object' ? JSON.stringify(value) : String(value);
  }

  function renderBar(state) {
    bar.textContent = '';
    fields.forEach(function (field) {
      var item = document.createElement('span');
      var value = document.createElement('b');
      try { value.textContent = text(field[1](state)); } catch (e) { value.textContent = '-'; }
      if (field[0] === 'objective' && state.status && state.status.objective) value.title = String(state.status.objective);
      if (field[0] === 'health') value.className = 'health-' + value.textContent;
      item.append(field[0] + ' ', value);
      bar.appendChild(item);
    });
    banner.style.display = (state.replay && state.replay.sync === 'diverged') ? 'block' : 'none';
  }

  var lastEvents = null;

  function renderEvents(list) {
    lastList = list;
    var format = mode === 'json' ? formatEventJson : formatEventPretty;
    var lines = list.map(format);
    var rendered = mode + '\n' + lines.join('\n');
    if (rendered === lastEvents) return;
    lastEvents = rendered;
    var pinned = events.scrollTop + events.clientHeight >= events.scrollHeight - 4;
    var top = events.scrollTop;
    events.textContent = '';
    list.forEach(function (event, index) {
      var row = document.createElement('div');
      row.className = event.type;
      row.textContent = lines[index];
      if (mode !== 'json') row.title = eventTitle(event);
      events.appendChild(row);
    });
    events.scrollTop = pinned ? events.scrollHeight : top;
  }

  function renderModeButton() {
    modeButton.textContent = mode === 'json' ? 'Format: JSON' : 'Format: readable';
  }

  modeButton.addEventListener('click', function () {
    mode = nextMode(mode);
    storeMode(mode);
    renderModeButton();
    renderEvents(lastList);
  });
  renderModeButton();

  function checked(r) {
    if (r.ok) return r;
    return r.json().catch(function () { return {}; }).then(function (body) { throw new Error(body.error || r.status); });
  }

  function updateLost() {
    lost.style.display = (frameOk && stateOk) ? 'none' : 'block';
    var error = stateError || frameError;
    lost.textContent = error ? 'Server error: ' + error : 'Connection lost, retrying...';
  }

  function messageOf(e) { return (e instanceof TypeError) ? null : e.message; }

  function pollFrame() {
    if (frameBusy) return;
    frameBusy = true;
    counter += 1;
    fetch('/frame.png?t=' + counter, { cache: 'no-store' })
      .then(checked).then(function (r) { return r.blob(); })
      .then(function (blob) {
        var old = img.src;
        img.src = URL.createObjectURL(blob);
        if (old.indexOf('blob:') === 0) URL.revokeObjectURL(old);
        frameOk = true;
        frameError = null;
      })
      .catch(function (e) { frameOk = false; frameError = messageOf(e); })
      .then(function () { frameBusy = false; updateLost(); });
  }

  function pollState() {
    if (stateBusy) return;
    stateBusy = true;
    fetch('/state.json', { cache: 'no-store' })
      .then(checked).then(function (r) { return r.json(); })
      .then(function (state) { renderBar(state); renderEvents(state.events || []); renderGrid(state.grid || null); stateOk = true; stateError = null; })
      .catch(function (e) { stateOk = false; stateError = messageOf(e); })
      .then(function () { stateBusy = false; updateLost(); });
  }

  setInterval(pollFrame, 100);
  setInterval(pollState, 500);
  pollFrame();
  pollState();
})();
</script>
</body>
</html>
