name: ROM
description: Restore the age-encrypted ROM from the Actions cache (downloading it when allowed), decrypt it into the runner's temp dir, check its SHA-256 and export KOHOLINT_ROM
inputs:
  rom-url:
    description: Direct download link of the encrypted ROM (secret ROM_URL)
    default: ''
  age-key:
    description: age identity that decrypts it (secret ROM_AGE_KEY)
    required: true
  download:
    description: on-miss downloads only when the cache misses, always downloads every time, never requires a cache hit
    default: never
runs:
  using: composite
  steps:
    - name: Check the ROM secrets
      shell: bash
      env:
        ROM_URL: ${{ inputs.rom-url }}
        ROM_AGE_KEY: ${{ inputs.age-key }}
        DOWNLOAD: ${{ inputs.download }}
      run: |
        missing=()
        [ -n "$ROM_AGE_KEY" ] || missing+=(ROM_AGE_KEY)
        [ "$DOWNLOAD" = never ] || [ -n "$ROM_URL" ] || missing+=(ROM_URL)
        if [ ${#missing[@]} -gt 0 ]; then
          echo "::error::Missing Actions secret(s): ${missing[*]}. Add them in Settings > Secrets and variables > Actions (see docs/OPERATING.md, ROM in CI)."
          exit 1
        fi
    - id: cache
      if: inputs.download != 'always'
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/rom-age/rom.age
        key: rom-age-${{ env.ROM_SHA256 }}-v1
        fail-on-cache-miss: ${{ inputs.download == 'never' }}
    - name: Download the encrypted ROM
      if: inputs.download == 'always' || steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        ROM_URL: ${{ inputs.rom-url }}
      run: mkdir -p "$RUNNER_TEMP/rom-age" && bin/fetch_asset "$ROM_URL" "$RUNNER_TEMP/rom-age/rom.age"
    - name: Decrypt and check the ROM
      shell: bash
      env:
        ROM_AGE_KEY: ${{ inputs.age-key }}
      run: |
        command -v age >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq age; }
        umask 077
        mkdir -p "$RUNNER_TEMP/rom"
        printf '%s\n' "$ROM_AGE_KEY" > "$RUNNER_TEMP/rom/key.txt"
        if ! head -c 21 "$RUNNER_TEMP/rom-age/rom.age" | grep -qE '^(age-encryption.org/v1|-----BEGIN AGE)'; then
          echo "::error::The downloaded ROM is not an age file: ROM_URL must point at zelda_dx_rev1.gbc.age itself."
          exit 1
        fi
        if ! age -d -i "$RUNNER_TEMP/rom/key.txt" -o "$RUNNER_TEMP/rom/game.gbc" "$RUNNER_TEMP/rom-age/rom.age"; then
          echo "::error::age could not decrypt the ROM: ROM_AGE_KEY does not match the key the file was encrypted to."
          exit 1
        fi
        rm "$RUNNER_TEMP/rom/key.txt"
        if ! echo "$ROM_SHA256  $RUNNER_TEMP/rom/game.gbc" | sha256sum -c --status; then
          echo "::error::The decrypted ROM's SHA-256 is not $ROM_SHA256: wrong file behind ROM_URL."
          exit 1
        fi
        echo "KOHOLINT_ROM=$RUNNER_TEMP/rom/game.gbc" >> "$GITHUB_ENV"
    - if: inputs.download != 'always' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/rom-age/rom.age
        key: rom-age-${{ env.ROM_SHA256 }}-v1
