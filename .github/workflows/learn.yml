name: learn

on:
  workflow_dispatch:
    inputs:
      run_url:
        description: Direct download link of a .tar.gz holding one full run directory (trace.jsonl, inputs.log, manifest.json, save/)
        required: true
      limit:
        description: koholint learn --limit
        default: '10'
      object:
        description: koholint learn --object (optional)
        default: ''

env:
  ROM_SHA256: 211a1d1559dc2684d63d87f62a6b1e9109201a6383b4004e9dd5e18ee926ee83

jobs:
  learn:
    name: koholint learn
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      EMU_GB_HOME: ${{ github.workspace }}/gemboy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kaderate/gemboy
          path: gemboy
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Install emu-gb's SDL dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsdl2-dev libsdl2-ttf-dev pkg-config age
          gem install sdl2-bindings
      - uses: ./.github/actions/rom
        with:
          rom-url: ${{ secrets.ROM_URL }}
          age-key: ${{ secrets.ROM_AGE_KEY }}
          download: on-miss
      - name: Fetch the run
        env:
          RUN_URL: ${{ inputs.run_url }}
        run: |
          bin/fetch_asset "$RUN_URL" "$RUNNER_TEMP/run.tar.gz"
          mkdir -p "$RUNNER_TEMP/runs"
          tar -xzf "$RUNNER_TEMP/run.tar.gz" -C "$RUNNER_TEMP/runs"
          run=$(dirname "$(find "$RUNNER_TEMP/runs" -name manifest.json | head -1)")
          [ -f "$run/trace.jsonl" ] || { echo "::error::The archive holds no run directory with manifest.json and trace.jsonl."; exit 1; }
          echo "RUN_DIR=$run" >> "$GITHUB_ENV"
      - name: Learn
        env:
          LIMIT: ${{ inputs.limit }}
          OBJECT: ${{ inputs.object }}
        run: |
          args=(learn "$RUN_DIR" --limit "$LIMIT")
          [ -z "$OBJECT" ] || args+=(--object "$OBJECT")
          bin/koholint "${args[@]}" | tee learn.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learn-${{ github.run_id }}
          path: |
            data/capabilities.json
            learn.log
