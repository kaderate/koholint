name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  ROM_SHA256: 211a1d1559dc2684d63d87f62a6b1e9109201a6383b4004e9dd5e18ee926ee83

jobs:
  test:
    name: rake test:ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EMU_GB_HOME: ${{ github.workspace }}/gemboy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kaderate/gemboy
          path: gemboy
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: rake test:ci

  rom-fetch:
    name: fetch ROM
    # Fork pull requests get no secrets: they run test:ci only
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rom
        with:
          rom-url: ${{ secrets.ROM_URL }}
          age-key: ${{ secrets.ROM_AGE_KEY }}
          download: on-miss

  rom:
    name: rake test (ROM, shard ${{ matrix.shard }}/4)
    needs: rom-fetch
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      EMU_GB_HOME: ${{ github.workspace }}/gemboy
      SHARD: ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kaderate/gemboy
          path: gemboy
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Install emu-gb's SDL dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsdl2-dev libsdl2-ttf-dev pkg-config age
          gem install sdl2-bindings
      - uses: ./.github/actions/rom
        with:
          age-key: ${{ secrets.ROM_AGE_KEY }}
      - run: rake test
