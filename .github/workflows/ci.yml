name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: rake test:ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EMU_GB_HOME: ${{ github.workspace }}/gemboy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kaderate/gemboy
          path: gemboy
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: rake test:ci
