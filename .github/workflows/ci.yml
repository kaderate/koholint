name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: rake test:ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EMU_GB_HOME: ${{ github.workspace }}/gemboy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kaderate/gemboy
          ref: 4dfa60660a6c229533c0b603c67df7b9765d2ef7
          path: gemboy
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true
      - run: rake test:ci

  rom-fetch:
    name: fetch ROM
    # Fork pull requests get no secrets: they run test:ci only
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rom
        with:
          rom-url: ${{ secrets.ROM_URL }}
          age-key: ${{ secrets.ROM_AGE_KEY }}
          download: on-miss

  rom:
    name: rake test (ROM, shard ${{ matrix.shard }}/4)
    needs: rom-fetch
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      EMU_GB_HOME: ${{ github.workspace }}/gemboy
      SHARD: ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kaderate/gemboy
          ref: 4dfa60660a6c229533c0b603c67df7b9765d2ef7
          path: gemboy
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true
      - name: Install emu-gb's SDL dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsdl2-dev libsdl2-ttf-dev pkg-config age
          gem install sdl2-bindings
      - uses: ./.github/actions/rom
        with:
          age-key: ${{ secrets.ROM_AGE_KEY }}
      # Only the timings: the rest of tmp/ holds emulator states derived from the ROM
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/test_times.json
          key: test-times-${{ github.run_id }}-${{ matrix.shard }}
          restore-keys: test-times-
      - run: rake test
      - if: always() && hashFiles('tmp/test_times.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/test_times.json
          key: test-times-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
